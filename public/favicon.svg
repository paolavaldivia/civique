<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="frenchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0055A4;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#0055A4;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#EF4135;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4135;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with French flag gradient -->
  <circle cx="50" cy="50" r="45" fill="url(#frenchGradient)" stroke="#2C3E50" stroke-width="2"/>

  <!-- Inner circle -->
  <circle cx="50" cy="50" r="35" fill="#FFFFFF" opacity="0.95"/>

  <!-- Letter C for Civique -->
  <path d="M 65 30 A 20 20 0 1 1 65 70" stroke="#0055A4" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="12" fill="#EF4135"/>
</svg>
